<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDV E-School — Milli Təhsil və İmtahan Portalı</title>

  <!-- Cybersecurity: Content Security Policy (CSP) & Hardening Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.gstatic.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; connect-src 'self' https://esm.sh https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://www.googleapis.com; frame-src 'none'; object-src 'none'; base-uri 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 for EdTech & Subject Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- KaTeX Math CSS & JS for Lightning-Fast Formula Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Canvas Confetti for Gamified PvP Wins -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Tailwind CSS Play CDN with Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet (Print styles, scrollbars, animations) -->
  <link rel="stylesheet" href="styles.css">

  <!-- Error Boundary Listener & Anti-XSS Sanitizer -->
  <script>
    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, function(tag) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[tag] || tag;
      });
    }

    window.addEventListener('error', function(e) {
      console.error('System error:', e);
      const root = document.getElementById('root');
      if (root && root.innerHTML.includes('animate-spin')) {
        root.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white p-6 text-center">
            <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-500 flex items-center justify-center text-2xl mb-4">⚠️</div>
            <h1 class="text-lg font-bold mb-1">Məlumat Yüklənmə Bildirişi</h1>
            <p class="text-xs text-slate-400 max-w-md mb-4">${escapeHTML(e.message || 'Səhifə yenilənir...')}</p>
            <button onclick="location.reload()" class="px-4 py-2 bg-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-700">Yenidən Yüklə</button>
          </div>
        `;
      }
    });
  </script>

  <!-- ESM Import Maps for zero-build Native React 18 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <!-- TDV Community Labs Ecosystem Global Bar -->
  <aside id="tdv-ecosystem-topbar" aria-label="TDV Community Labs Ecosystem Bar" class="bg-slate-950 border-b border-slate-800/90 py-1.5 px-3 sm:px-4 text-[11px] sticky top-0 z-50 transition-colors">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <!-- Left: Org Identity -->
      <div class="flex items-center gap-2 overflow-hidden whitespace-nowrap">
        <a href="https://tdv-community-hubs.vercel.app/" class="inline-flex items-center gap-1.5 font-extrabold text-white hover:text-blue-400 transition">
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
          <span class="tracking-tight">TDV Community Labs</span>
        </a>
        <span class="text-slate-700 hidden sm:inline">•</span>
        <span class="text-slate-400 text-[10px] hidden md:inline">Məktəb Rəqəmsal Ekosistemi</span>
      </div>

            <!-- Right: Unified Ecosystem Switcher Pill -->
      <nav class="flex items-center gap-1 bg-slate-900/90 border border-slate-800 p-1 rounded-2xl text-xs font-medium shadow-sm">
        <a href="https://tdv-community-hubs.vercel.app/" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 transition flex items-center gap-1.5" title="TDV Hub Mərkəzi Portalı">
          <i class="fas fa-house text-blue-400 text-xs"></i>
          <span class="hidden sm:inline">Mərkəz</span>
        </a>
        <a href="https://tdv-e-school.vercel.app/" class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-semibold shadow-sm flex items-center gap-1.5" title="TDV E-School (Aktiv)">
          <i class="fas fa-graduation-cap text-xs"></i>
          <span class="hidden sm:inline">E-School</span>
        </a>
        <a href="https://school-minifootball-tournament-2.vercel.app/" target="_blank" rel="noopener noreferrer" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 transition flex items-center gap-1.5" title="TDV Sports Minifutbol Turniri">
          <i class="fas fa-trophy text-blue-400 text-xs"></i>
          <span class="hidden sm:inline">Sports</span>
        </a>
        <a href="https://tdv-community-hubs.vercel.app/games" target="_blank" rel="noopener noreferrer" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-300 hover:text-white hover:bg-purple-950/40 hover:border-purple-500/30 transition flex items-center gap-1.5 group" title="TDV Games & Mafia">
          <i class="fas fa-gamepad text-purple-400 group-hover:scale-110 transition text-xs"></i>
          <span class="hidden sm:inline">Games</span>
          <span class="text-[9px] px-1.5 py-0.2 rounded bg-purple-500/20 text-purple-300 font-bold border border-purple-500/30">Mafia</span>
        </a>
        <a href="https://github.com/tdv-community-labs" target="_blank" rel="noopener noreferrer" class="hidden sm:flex px-2 py-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 transition" title="GitHub Təşkilatı">
          <i class="fab fa-github text-xs"></i>
        </a>
      </nav>
    </div>
  </aside>

  <div id="root">
    <!-- Initial Spinner while modules load -->
    <div class="min-h-screen flex flex-col items-center justify-center bg-slate-950 text-white space-y-4">
      <div class="relative flex items-center justify-center">
        <div class="animate-spin rounded-full h-14 w-14 border-4 border-indigo-500/30 border-t-indigo-500"></div>
        <i class="fas fa-graduation-cap absolute text-xl text-indigo-400"></i>
      </div>
      <div class="text-center">
        <div class="font-black tracking-wider text-sm uppercase bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">MəktəbPlus</div>
        <p class="text-[10px] text-slate-500 mt-0.5">Təhsil resursları və modullar hazırlanır...</p>
      </div>
    </div>
  </div>

  <!-- Bootstrapping Module -->
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom';
    import App from './app.js';

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(React.createElement(App));
  </script>
</body>
</html>
